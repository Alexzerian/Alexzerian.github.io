<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lumiere</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  touch-action: none;
  -webkit-text-size-adjust: 100%;
}
#gif, #hit {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  border: 0;
}
#gif {
  object-fit: cover;
  object-position: 72% center;
  background: #000 url("loading.gif") 72% center / cover no-repeat;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  pointer-events: none;
}
#hit {
  background: transparent;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
audio {
  position: absolute;
  width: 0;
  height: 0;
  opacity: 0;
  pointer-events: none;
}
</style>
<script>
function startAudio() {
  var audio = document.getElementById("song");
  if (!audio) return false;
  if (!audio.paused && audio.currentTime > 0) return false;
  try {
    audio.loop = true;
    var result = audio.play();
    if (result && result.catch) result.catch(function () {});
  } catch (err) {}
  return false;
}
</script>
</head>
<body ontouchstart="startAudio()" onclick="startAudio()">
<img id="gif" src="loading.gif" alt="">
<button id="hit" type="button" aria-label="Play" ontouchstart="startAudio()" onclick="startAudio()"></button>
<audio id="song" src="lumiere.mp3" loop autoplay preload="auto"></audio>
<script>
(function () {
  var audio = document.getElementById("song");
  var names = ["pointerdown", "touchstart", "touchend", "mousedown", "mouseup", "click", "keydown"];
  audio.loop = true;
  audio.addEventListener("ended", function () {
    try { audio.currentTime = 0; } catch (err) {}
    startAudio();
  });
  for (var i = 0; i < names.length; i++) {
    window.addEventListener(names[i], startAudio, true);
  }
  window.addEventListener("load", startAudio);
  window.addEventListener("pageshow", startAudio);
  startAudio();
})();
</script>
</body>
</html>
