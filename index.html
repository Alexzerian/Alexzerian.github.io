<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lumiere</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Lumiere">
<meta property="og:url" content="https://alexzerian.github.io/">
<meta property="og:image" content="https://alexzerian.github.io/lumiere.webp">
<meta property="og:image:type" content="image/webp">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Lumiere">
<meta name="twitter:image" content="https://alexzerian.github.io/lumiere.webp">
<meta name="theme-color" content="#000000">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  touch-action: none;
  -webkit-text-size-adjust: 100%;
}
#bg, #hit {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  border: 0;
}
#bg {
  object-fit: cover;
  object-position: 72% center;
  background: #000;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  pointer-events: none;
}
#hit {
  background: transparent;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
audio {
  position: absolute;
  width: 0;
  height: 0;
  opacity: 0;
  pointer-events: none;
}
</style>
<script>
var songLinked = false;
function startMedia() {
  var video = document.getElementById("bg");
  var audio = document.getElementById("song");
  if (video) {
    try {
      video.muted = true;
      video.loop = true;
      video.playsInline = true;
      if (video.paused) {
        var picture = video.play();
        if (picture && picture.catch) picture.catch(function () {});
      }
    } catch (err) {}
  }
  if (!audio) return false;
  if (!audio.paused && audio.currentTime > 0) return false;
  try {
    audio.loop = true;
    var result = audio.play();
    if (result && result.then) {
      result.then(function () {
        if (!songLinked && video) {
          songLinked = true;
          try { video.currentTime = 0; } catch (err) {}
        }
      }).catch(function () {});
    }
  } catch (err) {}
  return false;
}
</script>
</head>
<body ontouchstart="startMedia()" onclick="startMedia()">
<video id="bg" src="bg.mp4" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
<button id="hit" type="button" aria-label="Play" ontouchstart="startMedia()" onclick="startMedia()"></button>
<audio id="song" src="lumiere.mp3" loop autoplay preload="auto"></audio>
<script>
(function () {
  var video = document.getElementById("bg");
  var audio = document.getElementById("song");
  var names = ["pointerdown", "touchstart", "touchend", "mousedown", "mouseup", "click", "keydown"];
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  audio.loop = true;
  video.addEventListener("ended", function () {
    try { video.currentTime = 0; } catch (err) {}
    startMedia();
  });
  audio.addEventListener("ended", function () {
    try { audio.currentTime = 0; } catch (err) {}
    try { video.currentTime = 0; } catch (err) {}
    startMedia();
  });
  for (var i = 0; i < names.length; i++) {
    window.addEventListener(names[i], startMedia, true);
  }
  window.addEventListener("load", startMedia);
  window.addEventListener("pageshow", startMedia);
  startMedia();
})();
</script>
</body>
</html>
